<div class="cda-contacto" data-cda="aliados"></div>
<script>
/* Contáctenos + Nuestros aliados for Cargo, drawn as code in place of the Figma images.
data-cda on the host picks the version: "contacto" (desktop page 13, 1920x540 frame), "aliados" (desktop page 14,
1920x1152 frame), "movil" (mobile page 15, both sections in one 402-wide phone frame) or "enlaces" (page 3,
desktop and mobile: draws nothing, only makes the #formulario links work).
"Formulario" and "¡Únete a nuestro proyecto!" open our form. On submit it sends through Cargo's own contact form
endpoint, so the message goes to the address set in Publish Settings > Contact Form.
Any link on the site to #formulario also opens the form (#formulario-casa, #formulario-proyecto and
#formulario-aliado preselect "¿Qué te trae por aquí?").
Everything renders inside a shadow root: Cargo saves the page's live HTML and would otherwise store it.
Source: web-tests/cargo/contacto.src.html, built by build-contacto.py. */
(() => {
const VERSION = '928ffe2bbe';
const SITE_ID = 3758984;
const ENDPOINT = 'https://cargo.site/dispatch/notifications/sendContactMessage';
const TEL = '+57 313 336 6867';
const TEL_HREF = 'tel:+573133366867';
const MAIL = 'eliana.caicedo@infinitourbano.com';
/* Nuestros aliados is hidden for now (desktop page 14 is hidden in Cargo). With false the river ends at the
Formulario pill and the phone frame shows only Contáctenos; set true to bring the allies back on mobile. */
const MOSTRAR_ALIADOS = false;
const INTERES = { casa: 'Busco mi casa', proyecto: 'Quiero conocer el proyecto', aliado: 'Quiero ser aliado' };

const CSS = `
:host { display: block; width: 100%; }
.wrap { --azul: #5571D1; --cielo: #9ECFEB; --lima: #DBF174; --niebla: #E4EEF5; --tinta: #2A2222; --bosque: #3A5930; --noche: #2E3E76; --crema: #F9F9F2; --tierra: #816767; --gris: #D9D9D9;
--josefin: 'Josefin Sans Variable', 'Josefin Sans', system-ui, sans-serif; --grotesk: 'Aktiv Grotesk', system-ui, sans-serif;
container-type: inline-size; width: 100%; -webkit-font-smoothing: antialiased; }
.sec { --u: calc(100cqw / 1920); position: relative; overflow: clip; background: var(--niebla); color: var(--tinta); }
.sec.contacto { height: calc(540 * var(--u)); }
.sec.aliados { height: calc(1152 * var(--u)); background: var(--lima); }
.sec.movil { --u: calc(100cqw / 402); height: calc(900 * var(--u)); }
.sec.movil.corto { height: calc(360 * var(--u)); }
.river { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.river path { fill: none; stroke: var(--cielo); stroke-width: 26.4; }
.movil .river path { stroke-width: 14.5; }
.a { position: absolute; margin: 0; left: calc(var(--x) * var(--u)); top: calc(var(--y) * var(--u)); }
.box { width: calc(var(--w) * var(--u)); height: calc(var(--h) * var(--u)); }
h2 { font: 600 calc(90 * var(--u)) / .889 var(--josefin); letter-spacing: -.05em; color: var(--azul); }
.datos { display: flex; gap: calc(120 * var(--u)); }
.datos div { display: grid; gap: calc(10 * var(--u)); }
.datos dt { font: 400 calc(20 * var(--u)) / 1 var(--josefin); text-transform: uppercase; letter-spacing: .02em; color: var(--azul); }
.datos dd { margin: 0; font: 400 calc(32 * var(--u)) / 1.1 var(--grotesk); letter-spacing: -.02em; }
.datos a { color: var(--noche); text-decoration: none; }
.datos a:hover { text-decoration: underline; text-underline-offset: .2em; }
.pill { display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 0 calc(20 * var(--u)); text-align: center;
border: 0; border-radius: calc(34 * var(--u)); background: var(--azul); color: var(--crema); cursor: pointer;
font: 600 calc(35 * var(--u)) / 1 var(--josefin); letter-spacing: -.05em; transition: filter .2s, transform .2s; }
button.pill:hover { filter: brightness(1.08); transform: translateY(-2px); }
.tile { display: flex; flex-direction: column; justify-content: flex-end; box-sizing: border-box; padding: calc(14 * var(--u)) calc(12 * var(--u)) calc(16 * var(--u)) calc(16 * var(--u));
background: var(--tierra); color: var(--crema); font: 400 calc(22 * var(--u)) / 1.136 var(--josefin); letter-spacing: -.05em; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--azul); outline-offset: 3px; }

/* Phone frame (mobile page 15): 402 units wide */
.movil .titulo { width: 100%; left: 0; text-align: center; font-size: calc(46 * var(--u)); }
.movil .pill { padding: 0 calc(8 * var(--u)); border-radius: calc(13 * var(--u)); font-size: calc(18 * var(--u)); letter-spacing: -.03em; white-space: nowrap; }
.movil .pill.tag { cursor: default; }
.movil .datos { left: calc(56 * var(--u)); width: calc(320 * var(--u)); flex-direction: column; align-items: center; gap: calc(18 * var(--u)); text-align: center; }
.movil .datos div { gap: calc(6 * var(--u)); }
.movil .datos dt { font-size: calc(12 * var(--u)); }
.movil .datos dd { font-size: calc(17 * var(--u)); }
.movil .ph { border-radius: calc(12 * var(--u)); background: var(--gris); }

/* Fallback if a desktop frame ever renders narrow */
@container (max-width: 760px) {
.sec.contacto, .sec.aliados { height: auto; padding: 56px 24px 64px 44px; }
.sec.contacto .river, .sec.aliados .river { display: none; }
.sec.contacto::before, .sec.aliados::before { content: ""; position: absolute; left: 14px; top: 0; bottom: 0; width: 6px; border-radius: 3px; background: var(--cielo); }
.contacto .a, .aliados .a { position: relative; left: auto; top: auto; }
.contacto h2, .aliados h2 { font-size: clamp(40px, 11vw, 58px); }
.contacto .datos { flex-direction: column; gap: 20px; margin-top: 28px; }
.contacto .datos dt { font-size: 13px; }
.contacto .datos dd { font-size: 19px; overflow-wrap: anywhere; }
.contacto .pill, .aliados .pill { width: auto; height: auto; min-height: 56px; margin-top: 32px; padding: 14px 32px; border-radius: 28px; font-size: 21px; }
.aliados .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-top: 28px; }
.aliados .tile { position: static; width: auto; height: auto; min-height: 160px; font-size: 17px; padding: 12px; }
}

dialog { width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 0; border-radius: 28px; background: var(--niebla); color: var(--tinta); }
dialog::backdrop { background: rgba(46, 62, 118, .55); }
form { display: grid; gap: 14px; padding: 32px; font: 400 16px / 1.3 var(--grotesk); }
form h3 { margin: 0; font: 600 40px / 1 var(--josefin); letter-spacing: -.04em; color: var(--azul); }
label { display: grid; gap: 6px; font-weight: 400; }
input, select, textarea { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 2px solid transparent; border-radius: 14px; background: #fff; font: inherit; color: inherit; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--azul); }
.acciones { display: flex; gap: 12px; align-items: center; margin-top: 6px; }
.enviar { min-height: 52px; padding: 0 28px; border: 0; border-radius: 26px; background: var(--azul); color: var(--crema); font: 600 20px / 1 var(--josefin); letter-spacing: -.03em; cursor: pointer; }
.enviar:disabled { opacity: .6; cursor: progress; }
.cerrar { padding: 12px 8px; border: 0; background: none; font: 400 16px var(--grotesk); color: var(--tinta); text-decoration: underline; text-underline-offset: .2em; cursor: pointer; }
.estado { margin: 0; padding: 14px 16px; border-radius: 14px; background: var(--lima); color: var(--bosque); }
.estado.error { background: #fff; color: #9b1c1c; }
.estado[hidden] { display: none; }
@media (max-width: 600px) { form { padding: 24px 20px; gap: 12px; } form h3 { font-size: 32px; } }
`;

const DATOS = `<div><dt>Teléfono</dt><dd><a href="${TEL_HREF}">${TEL}</a></dd></div>
<div><dt>Correo</dt><dd><a href="mailto:${MAIL}">${MAIL}</a></dd></div>`;

/* Desktop allies tiles: left edge of each 159x213 tile, and the branch that drops into it from the river */
const TILES = [354.7, 578.1, 802.1, 1019.7, 1237.3, 1464.5];
const branch = x => { const c = x + 79.5; return `M${c - 120} 292A120 120 0 0 1 ${c} 412V421`; };

const SECTIONS = {
enlaces: '',
form: '',
contacto: `<section class="sec contacto" aria-labelledby="contacto-t">
<svg class="river" viewBox="0 0 1920 540" preserveAspectRatio="none" aria-hidden="true" focusable="false">${MOSTRAR_ALIADOS ? '<path d="M130 0V540"/>' : ''}<path d="M130 0V184A120 120 0 0 0 250 304H1420"/></svg>
<h2 class="a" id="contacto-t" style="--x:230;--y:118">Contáctenos</h2>
<dl class="a datos" style="--x:230;--y:372">${DATOS}</dl>
<button class="a box pill" type="button" data-form="" style="--x:1399;--y:258;--w:317;--h:91">Formulario</button>
</section>`,

aliados: `<section class="sec aliados" aria-labelledby="aliados-t">
<svg class="river" viewBox="0 0 1920 1152" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M130 0V172A120 120 0 0 0 250 292H1424A120 120 0 0 1 1544 412V900"/>${TILES.slice(0, 5).map(x => `<path d="${branch(x)}"/>`).join('')}</svg>
<h2 class="a" id="aliados-t" style="--x:230;--y:110">Nuestros aliados</h2>
<ul class="tiles" style="list-style:none;margin:0;padding:0">${TILES.map(x => `<li class="a box tile" style="--x:${x};--y:420;--w:159;--h:213">John<br>Doe</li>`).join('')}</ul>
<button class="a box pill" type="button" data-form="aliado" style="--x:1304;--y:887;--w:480;--h:97">¡Únete a nuestro proyecto!</button>
</section>`,

movil: MOSTRAR_ALIADOS ? `<section class="sec movil" aria-labelledby="contacto-m">
<svg class="river" viewBox="0 0 402 900" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M31.75 0V284A80 80 0 0 0 111.75 364.25H120"/><path d="M31.75 79A76 76 0 0 0 107.75 155H120"/><path d="M201 380V500M201 750V800"/></svg>
<h2 class="a titulo" id="contacto-m" style="--y:52">Contáctenos</h2>
<button class="a box pill" type="button" data-form="" style="--x:114;--y:131;--w:173.5;--h:48.5">Formulario</button>
<dl class="a datos" style="--y:212">${DATOS}</dl>
<h2 class="a box pill tag" style="--x:114;--y:340;--w:173.5;--h:48.5;text-align:center">Nuestros aliados</h2>
<div class="a box ph" style="--x:114.5;--y:493;--w:172.5;--h:261.5" aria-hidden="true"></div>
<button class="a box pill" type="button" data-form="aliado" style="--x:76;--y:800;--w:250;--h:48.5">¡Únete a nuestro proyecto!</button>
</section>` : `<section class="sec movil corto" aria-labelledby="contacto-m">
<svg class="river" viewBox="0 0 402 360" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M31.75 0V79A76 76 0 0 0 107.75 155H120"/></svg>
<h2 class="a titulo" id="contacto-m" style="--y:52">Contáctenos</h2>
<button class="a box pill" type="button" data-form="" style="--x:114;--y:131;--w:173.5;--h:48.5">Formulario</button>
<dl class="a datos" style="--y:212">${DATOS}</dl>
</section>`
};

const DIALOG = `<dialog aria-labelledby="form-t">
<form novalidate>
<h3 id="form-t">Escríbenos</h3>
<label>Nombre <input name="nombre" autocomplete="name" required></label>
<label>Correo <input name="correo" type="email" autocomplete="email" required></label>
<label>Teléfono <input name="telefono" type="tel" autocomplete="tel"></label>
<label>¿Qué te trae por aquí?
<select name="interes">
<option value="">Elige una opción</option>
<option>${INTERES.casa}</option>
<option>${INTERES.proyecto}</option>
<option>${INTERES.aliado}</option>
</select>
</label>
<label>Mensaje <textarea name="mensaje" rows="4"></textarea></label>
<div class="acciones">
<button class="enviar" type="submit">Enviar</button>
<button class="cerrar" type="button">Cerrar</button>
</div>
<p class="estado" role="status" hidden></p>
</form>
</dialog>`;

const EMAIL_RE = /^[^\s@]+@[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+$/i;

function mount(host) {
/* Cargo keeps the host element when the page HTML is updated in the editor, so re-render when the code changed */
if (host.shadowRoot && host.cdaVersion === VERSION) return host.shadowRoot;
const root = host.shadowRoot || host.attachShadow({ mode: 'open' });
host.cdaVersion = VERSION;
const section = host.dataset.cda in SECTIONS ? SECTIONS[host.dataset.cda] : SECTIONS.contacto;
root.innerHTML = '<style>' + CSS + '</style><div class="wrap">' + section + DIALOG + '</div>';
const dlg = root.querySelector('dialog');
const form = root.querySelector('form');
const estado = root.querySelector('.estado');
const enviar = root.querySelector('.enviar');
const say = (msg, isError) => { estado.textContent = msg; estado.classList.toggle('error', !!isError); estado.hidden = !msg; };

root.querySelectorAll('[data-form]').forEach(b => b.addEventListener('click', () => open(INTERES[b.dataset.form] || '')));
root.querySelector('.cerrar').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

form.addEventListener('submit', async e => {
e.preventDefault();
const f = form.elements;
const nombre = f.nombre.value.trim();
const correo = f.correo.value.trim();
if (!nombre) { say('Escribe tu nombre.', true); f.nombre.focus(); return; }
if (!EMAIL_RE.test(correo)) { say('Escribe un correo válido.', true); f.correo.focus(); return; }
const message = [
'Mensaje desde el formulario de Caminos del Agua',
'',
'Nombre: ' + nombre,
'Correo: ' + correo,
'Teléfono: ' + (f.telefono.value.trim() || '—'),
'¿Qué te trae por aquí?: ' + (f.interes.value || '—'),
'',
'Mensaje:',
f.mensaje.value.trim() || '—'
].join('\n');
enviar.disabled = true;
enviar.textContent = 'Enviando…';
say('');
try {
const res = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json; charset=UTF-8' },
body: JSON.stringify({ from: correo, site_id: SITE_ID, message }) });
if (!res.ok) throw new Error(res.status);
form.reset();
say('Gracias, recibimos tu mensaje. Te contactaremos pronto.');
} catch (err) {
say('No pudimos enviar el mensaje. Inténtalo de nuevo o escríbenos a ' + MAIL + '.', true);
} finally {
enviar.disabled = false;
enviar.textContent = 'Enviar';
}
});

function open(interes) {
say('');
form.elements.interes.value = interes || '';
if (!dlg.open) dlg.showModal();
form.elements.nombre.focus();
}
host.cdaOpenForm = open;
return root;
}

document.querySelectorAll('.cda-contacto').forEach(mount);

/* Links to #formulario anywhere on the site open the form. Cargo only renders stacked pages near the screen, so
the pages with those links (page 3) carry this script too (data-cda="enlaces", which draws nothing), and the form
opens in its own host appended to <body>, outside Cargo's page content. The listener runs in the capture phase on
window so it acts before Cargo's link router. */
if (!window.__cdaFormLinks) {
window.__cdaFormLinks = true;
window.addEventListener('click', e => {
const a = e.target && e.target.closest && e.target.closest('a[href*="#formulario"]');
if (!a) return;
e.preventDefault();
e.stopImmediatePropagation();
let host = document.getElementById('cda-form');
if (!host) {
host = document.createElement('div');
host.id = 'cda-form';
host.dataset.cda = 'form';
document.body.appendChild(host);
}
mount(host);
const key = (a.getAttribute('href').split('#formulario')[1] || '').replace(/^-/, '');
host.cdaOpenForm(INTERES[key] || '');
}, true);
}
})();
</script>
